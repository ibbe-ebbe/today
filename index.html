<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today — Prayer Times & Plans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root {
  --bg-deep: #141A2E;
  --bg-panel: #1C2440;
  --bg-panel-hi: #232C4D;
  --amber: #D7A24E;
  --rose: #C97B63;
  --teal: #5F9E96;
  --text: #F3ECE0;
  --text-muted: #8993B0;
  --line: rgba(243, 236, 224, 0.10);
  --radius: 14px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-deep);
  color: var(--text);
  font-family: "IBM Plex Sans", sans-serif;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(215,162,78,0.10), transparent 60%),
    var(--bg-deep);
}

main {
  max-width: 880px;
  margin: 0 auto;
  padding: 48px 24px 80px;
}

/* ---------- Hero ---------- */

.hero {
  text-align: center;
  padding: 8px 0 28px;
}

.hero-top {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-bottom: 22px;
}

.eyebrow {
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.eyebrow + .eyebrow::before {
  content: "·";
  margin-right: 14px;
  color: var(--line);
}

.next-label {
  font-family: "Fraunces", serif;
  font-weight: 400;
  font-size: 22px;
  color: var(--text-muted);
  margin: 0;
}

.next-label span {
  color: var(--amber);
  font-weight: 600;
}

.countdown {
  font-family: "IBM Plex Mono", monospace;
  font-size: clamp(48px, 12vw, 84px);
  font-weight: 500;
  letter-spacing: 0.02em;
  margin: 8px 0 4px;
  font-variant-numeric: tabular-nums;
}

.next-sub {
  color: var(--text-muted);
  font-size: 15px;
  margin: 0;
}

/* ---------- Arc (signature element) ---------- */

.arc-wrap {
  margin: 12px 0 40px;
}

#arc {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}

.arc-track {
  fill: none;
  stroke: var(--line);
  stroke-width: 2;
}

.arc-progress {
  fill: none;
  stroke-width: 2;
}

.arc-marker circle {
  stroke: var(--bg-deep);
  stroke-width: 3;
}

.arc-marker text {
  font-family: "IBM Plex Mono", monospace;
  fill: var(--text-muted);
  font-size: 12px;
}

.arc-marker .m-name {
  font-family: "Fraunces", serif;
  fill: var(--text);
  font-size: 14px;
}

.arc-marker.active .m-name {
  fill: var(--amber);
  font-weight: 600;
}

.now-dot {
  fill: var(--amber);
  filter: drop-shadow(0 0 6px rgba(215,162,78,0.8));
}

/* ---------- Panels ---------- */

.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-top: 12px;
}

@media (max-width: 640px) {
  .panels { grid-template-columns: 1fr; }
}

.panel {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
}

.panel-title {
  font-family: "Fraunces", serif;
  font-weight: 500;
  font-size: 17px;
  margin: 0 0 16px;
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.panel-num {
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px;
  color: var(--text-muted);
}

.prayer-list, .plan-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.prayer-list li, .plan-list li {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 10px 4px;
  border-bottom: 1px solid var(--line);
  font-size: 14.5px;
}

.prayer-list li:last-child, .plan-list li:last-child {
  border-bottom: none;
}

.prayer-list .p-name {
  font-family: "Fraunces", serif;
  font-size: 16px;
}

.prayer-list li.active .p-name {
  color: var(--amber);
}

.prayer-list .p-time,
.plan-list .pl-time {
  font-family: "IBM Plex Mono", monospace;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.plan-list li {
  flex-direction: column;
  align-items: stretch;
  gap: 4px;
}

.plan-list .pl-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.plan-list .pl-title {
  font-weight: 500;
}

.plan-list .pl-date {
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px;
  color: var(--teal);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.plan-list .pl-desc {
  color: var(--text-muted);
  font-size: 13px;
}

.skeleton {
  color: var(--text-muted);
  font-style: italic;
  border-bottom: none !important;
}

.empty-note {
  color: var(--text-muted);
  font-style: italic;
  padding: 10px 4px;
}

/* ---------- Footer ---------- */

.footer {
  text-align: center;
  margin-top: 44px;
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px;
  color: var(--text-muted);
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<main>
  <header class="hero">
    <div class="hero-top">
      <span class="eyebrow" id="hijri-date">—</span>
      <span class="eyebrow" id="gregorian-date">—</span>
    </div>
    <h1 class="next-label">Next: <span id="next-prayer-name">—</span></h1>
    <div class="countdown" id="countdown">--:--:--</div>
    <p class="next-sub" id="next-prayer-time">—</p>
  </header>

  <section class="arc-wrap" aria-label="Today's prayer schedule">
    <svg id="arc" viewBox="0 0 1000 220" preserveAspectRatio="xMidYMid meet"></svg>
  </section>

  <section class="panels">
    <div class="panel" id="panel-prayers">
      <h2 class="panel-title"><span class="panel-num">01</span> Today's Prayers</h2>
      <ul class="prayer-list" id="prayer-list">
        <li class="skeleton">Loading…</li>
      </ul>
    </div>

    <div class="panel" id="panel-plans">
      <h2 class="panel-title"><span class="panel-num">02</span> Upcoming Plans</h2>
      <ul class="plan-list" id="plan-list">
        <li class="skeleton">Loading…</li>
      </ul>
    </div>
  </section>

  <footer class="footer">
    <span id="status-line">Syncing with sheets…</span>
  </footer>
</main>

<script>
const CONFIG = {
  PRAYER_CSV_URL: "",
  CALENDAR_CSV_URL: "",
  PRAYER_COLUMNS: { date: "Date", fajr: "Fajr", dhuhr: "Dhuhr", asr: "Asr", maghrib: "Maghrib", isha: "Isha" },
  CALENDAR_COLUMNS: { date: "Date", time: "Time", title: "Title", description: "Description" },
  MAX_UPCOMING_PLANS: 8,
  USE_SAMPLE_DATA: true
};

/* ============================================================
   Prayer Times & Plans — single page, no build step.
   Reads CONFIG from config.js.
   ============================================================ */

const PRAYER_ORDER = ["fajr", "dhuhr", "asr", "maghrib", "isha"];
const PRAYER_LABELS = { fajr: "Fajr", dhuhr: "Dhuhr", asr: "Asr", maghrib: "Maghrib", isha: "Isha" };

// ---------- Sample data (used while USE_SAMPLE_DATA is true) ----------

function sampleData() {
  const today = new Date();
  const iso = (d) => d.toISOString().slice(0, 10);
  const prayers = [];
  const plans = [];
  for (let i = -1; i <= 3; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() + i);
    prayers.push({ date: iso(d), fajr: "04:52", dhuhr: "12:14", asr: "15:48", maghrib: "18:31", isha: "19:52" });
  }
  plans.push({ date: iso(today), time: "16:00", title: "Reel servicing pickup", description: "Drop off SeaEagle 80W" });
  const d2 = new Date(today); d2.setDate(d2.getDate() + 1);
  plans.push({ date: iso(d2), time: "09:00", title: "Team sync", description: "" });
  const d3 = new Date(today); d3.setDate(d3.getDate() + 3);
  plans.push({ date: iso(d3), time: "", title: "World Cup group draw watch", description: "With the prediction group" });
  return { prayers, plans };
}

// ---------- CSV parsing ----------

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const headers = rows[0].map((h) => h.trim());
  return rows.slice(1)
    .filter((r) => r.some((v) => v && v.trim().length))
    .map((r) => {
      const obj = {};
      headers.forEach((h, idx) => { obj[h] = (r[idx] || "").trim(); });
      return obj;
    });
}

async function fetchCSV(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`Fetch failed: ${res.status}`);
  return parseCSV(await res.text());
}

// ---------- Data normalization ----------

function normalizePrayers(rows) {
  const c = CONFIG.PRAYER_COLUMNS;
  return rows.map((r) => ({
    date: r[c.date],
    fajr: r[c.fajr],
    dhuhr: r[c.dhuhr],
    asr: r[c.asr],
    maghrib: r[c.maghrib],
    isha: r[c.isha]
  })).filter((r) => r.date);
}

function normalizePlans(rows) {
  const c = CONFIG.CALENDAR_COLUMNS;
  return rows.map((r) => ({
    date: r[c.date],
    time: r[c.time],
    title: r[c.title],
    description: r[c.description]
  })).filter((r) => r.date && r.title);
}

// ---------- Time helpers ----------

function toISODate(d) { return d.toISOString().slice(0, 10); }

function parseDateFlexible(str) {
  // Accepts YYYY-MM-DD, MM/DD/YYYY, DD/MM/YYYY (best effort), or anything Date() can parse.
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) return new Date(str + "T00:00:00");
  const d = new Date(str);
  return isNaN(d) ? null : d;
}

function timeToMinutes(t) {
  if (!t) return null;
  const m = t.match(/(\d{1,2}):(\d{2})\s*(AM|PM|am|pm)?/);
  if (!m) return null;
  let h = parseInt(m[1], 10);
  const min = parseInt(m[2], 10);
  if (m[3]) {
    const pm = m[3].toLowerCase() === "pm";
    if (pm && h !== 12) h += 12;
    if (!pm && h === 12) h = 0;
  }
  return h * 60 + min;
}

function fmtTime(t) {
  const mins = timeToMinutes(t);
  if (mins === null) return t || "—";
  const h = Math.floor(mins / 60), m = mins % 60;
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2, "0")} ${period}`;
}

function fmtCountdown(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const h = String(Math.floor(total / 3600)).padStart(2, "0");
  const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
  const s = String(total % 60).padStart(2, "0");
  return `${h}:${m}:${s}`;
}

// ---------- App state ----------

let PRAYERS = [];
let PLANS = [];
let nextPrayerTarget = null;

function findTodayRow(dateISO) {
  return PRAYERS.find((r) => r.date === dateISO) || PRAYERS[0] || null;
}

function computeNextPrayer(now) {
  const todayISO = toISODate(now);
  const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;

  const tryDay = (dateISO, isToday) => {
    const row = PRAYERS.find((r) => r.date === dateISO);
    if (!row) return null;
    for (const key of PRAYER_ORDER) {
      const mins = timeToMinutes(row[key]);
      if (mins === null) continue;
      if (!isToday || mins > nowMin) {
        const target = new Date(dateISO + "T00:00:00");
        target.setMinutes(target.getMinutes() + mins);
        return { key, row, target };
      }
    }
    return null;
  };

  let result = tryDay(todayISO, true);
  if (!result) {
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    result = tryDay(toISODate(tomorrow), false);
  }
  return result;
}

// ---------- Rendering ----------

function renderCountdown(now) {
  const info = computeNextPrayer(now);
  if (!info) {
    document.getElementById("next-prayer-name").textContent = "—";
    document.getElementById("countdown").textContent = "--:--:--";
    document.getElementById("next-prayer-time").textContent = "No upcoming times found";
    return;
  }
  nextPrayerTarget = info;
  document.getElementById("next-prayer-name").textContent = PRAYER_LABELS[info.key];
  document.getElementById("countdown").textContent = fmtCountdown(info.target - now);
  document.getElementById("next-prayer-time").textContent = fmtTime(info.row[info.key]);
}

function renderPrayerList(now) {
  const todayISO = toISODate(now);
  const row = findTodayRow(todayISO);
  const list = document.getElementById("prayer-list");
  list.innerHTML = "";
  if (!row) {
    list.innerHTML = `<li class="empty-note">No prayer times found for today.</li>`;
    return;
  }
  const activeKey = nextPrayerTarget && nextPrayerTarget.row.date === row.date ? nextPrayerTarget.key : null;
  PRAYER_ORDER.forEach((key) => {
    const li = document.createElement("li");
    if (key === activeKey) li.classList.add("active");
    li.innerHTML = `<span class="p-name">${PRAYER_LABELS[key]}</span><span class="p-time">${fmtTime(row[key])}</span>`;
    list.appendChild(li);
  });
}

function renderPlans(now) {
  const list = document.getElementById("plan-list");
  list.innerHTML = "";
  const upcoming = PLANS
    .map((p) => ({ ...p, _d: parseDateFlexible(p.date) }))
    .filter((p) => p._d && p._d >= new Date(now.getFullYear(), now.getMonth(), now.getDate()))
    .sort((a, b) => a._d - b._d || (timeToMinutes(a.time) || 0) - (timeToMinutes(b.time) || 0))
    .slice(0, CONFIG.MAX_UPCOMING_PLANS);

  if (!upcoming.length) {
    list.innerHTML = `<li class="empty-note">Nothing upcoming.</li>`;
    return;
  }

  upcoming.forEach((p) => {
    const li = document.createElement("li");
    const dateLabel = p._d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    const timeLabel = p.time ? fmtTime(p.time) : "";
    li.innerHTML = `
      <div class="pl-head">
        <span class="pl-title">${escapeHTML(p.title)}</span>
        <span class="pl-date">${dateLabel}${timeLabel ? " · " + timeLabel : ""}</span>
      </div>
      ${p.description ? `<span class="pl-desc">${escapeHTML(p.description)}</span>` : ""}
    `;
    list.appendChild(li);
  });
}

function escapeHTML(str) {
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}

function renderDates(now) {
  document.getElementById("gregorian-date").textContent = now.toLocaleDateString(undefined, {
    weekday: "long", month: "long", day: "numeric"
  });
  try {
    const hijri = new Intl.DateTimeFormat("en-TN-u-ca-islamic", { day: "numeric", month: "long", year: "numeric" }).format(now);
    document.getElementById("hijri-date").textContent = hijri;
  } catch (e) {
    document.getElementById("hijri-date").textContent = "";
  }
}

// ---------- Arc (signature visual) ----------

function drawArc(now) {
  const svg = document.getElementById("arc");
  const todayISO = toISODate(now);
  const row = findTodayRow(todayISO);
  const W = 1000, H = 220, PAD = 60, Y = 130, AMP = 46;

  const xFor = (frac) => PAD + frac * (W - PAD * 2);
  const yFor = (frac) => Y - Math.sin(frac * Math.PI) * AMP;

  let svgParts = `
    <defs>
      <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#5F9E96"/>
        <stop offset="22%" stop-color="#D7A24E"/>
        <stop offset="50%" stop-color="#F3ECE0"/>
        <stop offset="78%" stop-color="#C97B63"/>
        <stop offset="100%" stop-color="#5F9E96"/>
      </linearGradient>
    </defs>
  `;

  const points = [];
  for (let i = 0; i <= 100; i++) {
    const frac = i / 100;
    points.push(`${xFor(frac).toFixed(1)},${yFor(frac).toFixed(1)}`);
  }
  const pathD = `M${points[0]} L${points.slice(1).join(" L")}`;
  svgParts += `<path class="arc-track" d="${pathD}" stroke="url(#arcGrad)" opacity="0.55" />`;

  if (row) {
    PRAYER_ORDER.forEach((key, idx) => {
      const mins = timeToMinutes(row[key]);
      if (mins === null) return;
      const frac = Math.min(1, Math.max(0, mins / (24 * 60)));
      const x = xFor(frac), y = yFor(frac);
      const above = idx % 2 === 0;
      const isActive = nextPrayerTarget && nextPrayerTarget.key === key && nextPrayerTarget.row.date === row.date;
      svgParts += `
        <g class="arc-marker ${isActive ? "active" : ""}">
          <circle cx="${x}" cy="${y}" r="6" fill="${isActive ? "#D7A24E" : "#8993B0"}" />
          <text class="m-name" x="${x}" y="${above ? y - 22 : y + 34}" text-anchor="middle">${PRAYER_LABELS[key]}</text>
          <text x="${x}" y="${above ? y - 8 : y + 48}" text-anchor="middle">${fmtTime(row[key])}</text>
        </g>
      `;
    });

    const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    const nowFrac = Math.min(1, Math.max(0, nowMin / (24 * 60)));
    const nx = xFor(nowFrac), ny = yFor(nowFrac);
    svgParts += `<circle class="now-dot" cx="${nx}" cy="${ny}" r="5" />`;
  }

  svg.innerHTML = svgParts;
}

// ---------- Tick loop ----------

function tick() {
  const now = new Date();
  renderCountdown(now);
  drawArc(now);
  if (document.getElementById("countdown").dataset.lastMin !== String(now.getMinutes())) {
    document.getElementById("countdown").dataset.lastMin = String(now.getMinutes());
    renderPrayerList(now);
    renderPlans(now);
    renderDates(now);
  }
}

// ---------- Boot ----------

async function boot() {
  const status = document.getElementById("status-line");
  try {
    if (CONFIG.USE_SAMPLE_DATA) {
      const sample = sampleData();
      PRAYERS = sample.prayers;
      PLANS = sample.plans;
      status.textContent = "Showing sample data — set USE_SAMPLE_DATA to false in config.js once your sheet links work.";
    } else {
      const [prayerRows, planRows] = await Promise.all([
        fetchCSV(CONFIG.PRAYER_CSV_URL),
        fetchCSV(CONFIG.CALENDAR_CSV_URL)
      ]);
      PRAYERS = normalizePrayers(prayerRows);
      PLANS = normalizePlans(planRows);
      status.textContent = `Synced · ${PRAYERS.length} prayer rows · ${PLANS.length} plan rows`;
    }
  } catch (err) {
    status.textContent = `Couldn't load sheets (${err.message}). Falling back to sample data.`;
    const sample = sampleData();
    PRAYERS = sample.prayers;
    PLANS = sample.plans;
  }

  const now = new Date();
  renderDates(now);
  renderCountdown(now);
  renderPrayerList(now);
  renderPlans(now);
  drawArc(now);
  setInterval(tick, 1000);
}

boot();
</script>
</body>
</html>
